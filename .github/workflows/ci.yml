name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. CI checks out and runs the suite; it never writes to the
# repository. Without this the job gets whatever the repository's default
# token scope is, which may be write. The three sweep workflows already say
# the same.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # Dummy values: the build only needs env vars to EXIST — every page is
      # dynamic, so nothing connects to real services at build time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      # Required by db/guard.ts, which refuses any database not declared as a
      # development one. Next.js evaluates route modules while collecting page
      # data during `next build`, so db/index.ts is imported and the guard runs
      # even though nothing connects — CI went red for six commits before this
      # was noticed. Vercel is unaffected: VERCEL_ENV is set there.
      #
      # Truthful, not a workaround: the CI database is a throwaway localhost
      # instance that exists for the length of one job.
      DATABASE_ENV: development
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_ci_dummy
      RESEND_API_KEY: re_placeholder
      INBOUND_WEBHOOK_SECRET: dev-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INBOUND_EMAIL_DOMAIN: ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11, not the npm 10 that ships with Node 22. npm 10 crashes on this
      # project's peer-dependency tree ("Cannot read properties of null
      # (reading 'edgesOut')") whenever the lockfile has to change, so the
      # lockfile is made with npm 11 — and npm 10's `npm ci` rejects an npm 11
      # lockfile (esbuild's platform packages read as missing). That mismatch
      # turned main red on 20 Nov 2026. Same major here as wherever the
      # lockfile is written; Jordan's call, 21 Nov 2026.
      - run: npm install -g npm@11
      - run: npm ci
      # FIRST, and on purpose.
      #
      # Both build breakages this repo has had were characters in a comment
      # that terminated the thing the comment lived inside: a cron expression
      # in a block comment, where the slash-star-slash ended it, and a stray
      # backtick inside a sql`` template. Both are PARSE errors, so no lint
      # rule can catch them — the file does not parse for the linter either.
      # The only defence is a typecheck, and the only thing that makes a
      # typecheck useful is running it before anything slower.
      #
      # It used to be reached only via `next build`, several minutes in, and it
      # reported as a build failure rather than as the one-line syntax error it
      # actually was.
      #
      # `npm run typecheck` runs `next typegen` first, and that is load-bearing
      # rather than tidiness. RouteContext and friends are GENERATED into
      # .next/types by the build, so a bare `tsc --noEmit` ahead of the build
      # fails on every route handler with "Cannot find name RouteContext".
      # Moving typecheck first without it broke CI on every commit for a day —
      # and it passed locally the whole time, because a running `next dev`
      # regenerates those types continuously.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
